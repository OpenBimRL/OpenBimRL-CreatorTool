name: Create new Release
run-name: ${{ github.actor }} created a new release
permissions: write-all
on:
  push:
    branches:
      - master

jobs:
  create_release:
    defaults:
        run:
            shell: bash
            working-directory: webapp

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get package version
        id: get_package_version
        run: echo "VERSION=v$(pnpm pkg get version | tr -d '\"')" >> "$GITHUB_OUTPUT"
      
      - name: build app
        run: pnpm run build

      - name: zip build
        run: zip -r build.zip dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ steps.get_package_version.outputs.VERSION  }} ./build.zip

name: Create new Draft
run-name: ${{ github.actor }} created a new draft
permissions: write-all
on:
    push:
        branches:
            - v-*

jobs:
    create_release:
        defaults:
            run:
                shell: bash
                working-directory: webapp

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm
                  cache-dependency-path: webapp/pnpm-lock.yaml
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Auto-format
              run: pnpm run format

            - name: build app
              run: pnpm run build

            - name: Create patch version
              id: create_patch_version
              run: |
                  echo "VERSION=$(pnpm version patch)" >> "$GITHUB_OUTPUT"

            - run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add .
                  git commit -m "automatically generated patch event"
                  git push

            - name: create pull-request
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr create --title "releasing ${{ steps.create_patch_version.outputs.VERSION  }}" --body "please approve to merge on master" --base master --head "${{ github.ref  }}"
